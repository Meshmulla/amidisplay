# Builds the AMIDisplay Windows installer.
# - On every push to main that touches the app: the installer is kept as a download on the run.
# - When a release is published on GitHub (Releases > Draft a new release, tag like v0.2.0):
#   the installer is attached to that release.
# - Or by hand from the Actions tab ("Run workflow").
name: Windows installer

on:
  push:
    branches: [main]
    paths: ["desktop/**", "src/**", "data/**", "assets/**", "index.html", "display.html", "package.json", "package-lock.json", "build/**", ".github/workflows/desktop.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build installer
        run: npx electron-builder --win nsis --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: AMIDisplay-Windows-installer
          path: dist/AMIDisplay-Setup-*.exe
          retention-days: 30

      - name: Attach to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/AMIDisplay-Setup-*.exe --clobber
